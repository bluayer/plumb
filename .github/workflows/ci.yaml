name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release tags run the same fast checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test review and E2E status handling
        run: node --test .github/scripts/pr-checks.test.cjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            hack/tools/actionlint/go.sum
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Generated code is up to date
        run: make verify-generate
      - name: go.mod and go.sum are tidy
        run: make verify-mod
