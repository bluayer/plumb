# Shadow mode (the default): the agent records decisions and recommended floors in status
# and the decision log, and changes nothing. Set mode: auto to opt in.
apiVersion: plumb.bluayer.io/v1alpha1
kind: AdaptivePolicy
metadata:
  name: llm-inference
  namespace: inference
spec:
  mode: shadow
  workload:
    name: llm-inference
  podRequests:
    nvidia.com/gpu: "1"
  knownInstanceTypes: [p5.48xlarge, p4d.24xlarge, g6e.12xlarge]
  regions:
    - name: us-east-1            # the cluster the agent runs in
      nodePools: [gpu]
      nodeSelector:
        eks.amazonaws.com/nodegroup: reserved-gpu   # static (reserved) capacity outside Karpenter
      maxReplicas: 40
      costRank: 0
    - name: us-west-2
      kubeconfigSecretRef:
        name: us-west-2-kubeconfig
      nodePools: [gpu]
      maxReplicas: 40
      costRank: 10
  tuning:
    cooldown: 5m
    hysteresisMargin: "0.2"
    confidenceThreshold: "0.7"
    iceWindow: 10m
    outcomeHorizon: 10m
