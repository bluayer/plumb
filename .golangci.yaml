version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115 # int -> int32 on replica and node counts, bounded far below 2^31
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/bluayer/plumb]
run:
  build-tags: [e2e]
