apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plumb.name" . }}-agent
  labels: {{- include "plumb.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plumb.name" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "plumb.name" . }}-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plumb-agent
---
# Secrets in this namespace only: kubeconfig-secretreader style access providers read the
# other members' credentials from here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "plumb.name" . }}-agent
  labels: {{- include "plumb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "plumb.name" . }}-agent
  labels: {{- include "plumb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plumb.name" . }}-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "plumb.name" . }}-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "plumb.name" . }}-scaler
rules:
  - apiGroups: [plumb-k8s.github.io]
    resources: [adaptivepolicies]
    verbs: [get, list, watch]
---
# The hub Lease, to check that an intent comes from the current hub.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plumb.name" . }}-scaler
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "plumb.name" . }}-scaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plumb.name" . }}-scaler
subjects:
  - kind: ServiceAccount
    name: {{ include "plumb.name" . }}-scaler
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "plumb.name" . }}-scaler
