apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.scaler.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "plumb.name" . }}-scaler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "plumb.name" . }}-scaler}
    spec:
      serviceAccountName: {{ include "plumb.name" . }}-scaler
      {{- include "plumb.podSecurityContext" . | nindent 6 }}
      {{- include "plumb.podScheduling" (list . .Values.scaler) | nindent 6 }}
      containers:
        - name: scaler
          image: {{ include "plumb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - scaler
            {{- if .Values.scaler.tlsSecretName }}
            - --tls-cert-file=/etc/plumb/tls/tls.crt
            - --tls-key-file=/etc/plumb/tls/tls.key
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: grpc, containerPort: 6000}
            - {name: metrics, containerPort: 8080}
          {{- if not .Values.scaler.tlsSecretName }}
          readinessProbe: {grpc: {port: 6000}}
          {{- else }}
          readinessProbe: {tcpSocket: {port: grpc}}
          volumeMounts:
            - {name: tls, mountPath: /etc/plumb/tls, readOnly: true}
          {{- end }}
          resources: {{- toYaml .Values.scaler.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      {{- with .Values.scaler.tlsSecretName }}
      volumes:
        - name: tls
          secret: {secretName: {{ . }}}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "plumb.name" . }}-scaler}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plumb.name" . }}-scaler
  labels: {{- include "plumb.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "plumb.name" . }}-scaler
spec:
  selector: {app.kubernetes.io/name: {{ include "plumb.name" . }}-scaler}
  ports:
    - {name: grpc, port: 6000, targetPort: grpc}
    - {name: metrics, port: 8080, targetPort: metrics}
