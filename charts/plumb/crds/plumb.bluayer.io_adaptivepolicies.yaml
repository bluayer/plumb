---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: adaptivepolicies.plumb.bluayer.io
spec:
  group: plumb.bluayer.io
  names:
    kind: AdaptivePolicy
    listKind: AdaptivePolicyList
    plural: adaptivepolicies
    shortNames:
    - ap
    singular: adaptivepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.lastDecision.action
      name: Action
      type: string
    - jsonPath: .status.lastDecision.targetRegion
      name: Target
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AdaptivePolicy configures adaptive scheduling for one multi-region
          workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AdaptivePolicySpec defines the desired behaviour of the agent
              for one workload.
            properties:
              knownInstanceTypes:
                description: |-
                  KnownInstanceTypes is the instance type catalog. Events naming other types are treated
                  as out of distribution and never sent to the model.
                items:
                  type: string
                type: array
              mode:
                default: shadow
                description: Mode controls whether decisions are applied.
                enum:
                - shadow
                - auto
                type: string
              podRequests:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: PodRequests are the resources one replica requests. When
                  empty they are read from the Deployment.
                type: object
              regions:
                description: Regions lists the regions the workload runs in. At most
                  20 (the model choice limit).
                items:
                  description: RegionSpec describes one region the workload runs in.
                  properties:
                    costRank:
                      description: CostRank orders regions by preference when everything
                        else is equal. Lower is preferred.
                      format: int32
                      type: integer
                    kubeconfigSecretRef:
                      description: |-
                        KubeconfigSecretRef points at a kubeconfig for the region's cluster.
                        When empty the cluster the agent runs in is used.
                      properties:
                        key:
                          default: kubeconfig
                          type: string
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    maxReplicas:
                      description: MaxReplicas caps the replica target the agent may
                        recommend for this region.
                      format: int32
                      minimum: 0
                      type: integer
                    name:
                      description: Name is the region identifier, e.g. us-east-1.
                      type: string
                    nodePools:
                      description: NodePools are the Karpenter NodePools that may
                        serve the workload in this region.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: |-
                        NodeSelector optionally narrows which existing nodes count as static capacity. Without
                        it, every node the workload's pod template can schedule on counts (node selector and
                        affinity, tolerations, pod (anti-)affinity and topology spread are all honoured).
                      type: object
                  required:
                  - maxReplicas
                  - name
                  - nodePools
                  type: object
                maxItems: 20
                minItems: 1
                type: array
              tuning:
                description: DecisionTuning holds cooldown, hysteresis and model gating
                  parameters.
                properties:
                  confidenceThreshold:
                    default: "0.7"
                    description: ConfidenceThreshold is the minimum calibrated model
                      confidence to accept a model answer.
                    type: string
                  cooldown:
                    default: 5m
                    description: Cooldown is the minimum time between two changes
                      of the same kind.
                    type: string
                  hysteresisMargin:
                    default: "0.2"
                    description: |-
                      HysteresisMargin is how much better (relative, 0.2 = 20%) a new choice must score
                      than the current one before the agent switches.
                    type: string
                  iceWindow:
                    default: 10m
                    description: ICEWindow is the lookback window used to count recent
                      capacity errors.
                    type: string
                  outcomeHorizon:
                    default: 10m
                    description: OutcomeHorizon is how long after a decision its outcome
                      is recorded.
                    type: string
                type: object
              workload:
                description: Workload is the Deployment replicated across regions.
                properties:
                  name:
                    description: Name of the Deployment. The same name is expected
                      in every region.
                    type: string
                  namespace:
                    description: Namespace of the Deployment. Defaults to the policy
                      namespace.
                    type: string
                required:
                - name
                type: object
            required:
            - regions
            - workload
            type: object
          status:
            description: AdaptivePolicyStatus is written by the agent and read by
              the scaler.
            properties:
              activeTargetRegion:
                description: ActiveTargetRegion is the destination of the shift currently
                  holding replica floors.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              heartbeatTime:
                description: |-
                  HeartbeatTime is refreshed on every reconcile. The scaler treats targets older than
                  its staleness limit as absent and stops influencing scaling.
                format: date-time
                type: string
              lastChangeTime:
                description: LastChangeTime is when the recommended targets last changed
                  (cooldown anchor).
                format: date-time
                type: string
              lastDecision:
                description: DecisionSummary is the last decision the agent made.
                properties:
                  action:
                    description: 'Action is the final action: use_static, wait_and_retry,
                      fallback_in_region, shift_to_other_region, escalate, none.'
                    type: string
                  applied:
                    description: Applied is true only in auto mode after the change
                      was written.
                    type: boolean
                  id:
                    type: string
                  message:
                    type: string
                  source:
                    description: Source is rule, model or guardrail.
                    type: string
                  targetRegion:
                    type: string
                  time:
                    format: date-time
                    type: string
                  trigger:
                    description: Trigger is what caused the decision, e.g. ice or
                      periodic.
                    type: string
                required:
                - action
                - applied
                - id
                - source
                - time
                - trigger
                type: object
              lastSafeTargets:
                description: |-
                  LastSafeTargets are the last targets that were applied without error. On failure the
                  agent keeps serving these instead of new ones.
                items:
                  description: RegionTarget is the agent's replica recommendation
                    for one region.
                  properties:
                    currentReplicas:
                      description: CurrentReplicas observed on the Deployment.
                      format: int32
                      type: integer
                    reason:
                      type: string
                    recommendedReplicas:
                      description: |-
                        RecommendedReplicas is a replica floor the KEDA external scaler serves in auto mode.
                        0 means no opinion: the scaler reports 0 and the ScaledObject's other triggers decide.
                      format: int32
                      type: integer
                    region:
                      type: string
                  required:
                  - currentReplicas
                  - recommendedReplicas
                  - region
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration of the spec the status reflects.
                format: int64
                type: integer
              regionTargets:
                items:
                  description: RegionTarget is the agent's replica recommendation
                    for one region.
                  properties:
                    currentReplicas:
                      description: CurrentReplicas observed on the Deployment.
                      format: int32
                      type: integer
                    reason:
                      type: string
                    recommendedReplicas:
                      description: |-
                        RecommendedReplicas is a replica floor the KEDA external scaler serves in auto mode.
                        0 means no opinion: the scaler reports 0 and the ScaledObject's other triggers decide.
                      format: int32
                      type: integer
                    region:
                      type: string
                  required:
                  - currentReplicas
                  - recommendedReplicas
                  - region
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
